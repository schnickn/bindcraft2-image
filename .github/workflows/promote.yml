name: Promote image

# Points one tag of ghcr.io/<owner>/bindcraft2 at the image another tag already holds, without rebuilding.
# Use it to give students (who pull the plain :cuda12 tag) a BindCraft2 build only after it has been tested:
# the exact tested image, not a fresh build that might resolve newer dependencies.
#
# Run it from the Actions tab: source_tag is the tested tag (for example cuda12-d502f19), target_tag is the
# one to move (default cuda12). The previous target keeps working under its own versioned tag.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing tag holding the tested image, for example cuda12-d502f19
        required: true
      target_tag:
        description: Tag to point at it
        default: cuda12

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag without rebuilding
        env:
          OWNER: ${{ github.repository_owner }}
          SRC: ${{ inputs.source_tag }}
          DST: ${{ inputs.target_tag }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/bindcraft2"
          [[ "$SRC" =~ ^[A-Za-z0-9_.-]+$ && "$DST" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "tags may only contain letters, digits, _ . -"; exit 1; }
          before="$(docker buildx imagetools inspect "$image:$DST" 2>/dev/null | sed -n 's/^Digest: *//p' | head -1)"
          docker buildx imagetools create --tag "$image:$DST" "$image:$SRC"
          src_digest="$(docker buildx imagetools inspect "$image:$SRC" | sed -n 's/^Digest: *//p' | head -1)"
          dst_digest="$(docker buildx imagetools inspect "$image:$DST" | sed -n 's/^Digest: *//p' | head -1)"
          echo "$DST was: ${before:-<none>}"
          echo "$DST now: $dst_digest"
          echo "$SRC is : $src_digest"
          [ "$src_digest" = "$dst_digest" ] || { echo "digests differ"; exit 1; }
